name: Publish release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version matching TOC (e.g. 1.3.19)'
        required: true
        type: string
      confirm:
        description: 'I have reviewed licensing, in-game testing and release contents'
        required: true
        type: boolean
permissions:
  contents: read
concurrency:
  group: stable-release
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/master' && github.actor == 'smobcraft' && inputs.confirm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - run: python3 tools/validate.py
      - run: lua5.1 tests/prediction.lua
      - run: python3 tools/package.py --version "$VERSION"
        env:
          VERSION: ${{ inputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: dist/GrindOnly.zip
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: dist
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          SHA: ${{ github.sha }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          gh release create "v$VERSION" dist/GrindOnly.zip --target "$SHA" --title "Grind Only v$VERSION" --generate-notes --latest
